# iOS Simulator (iphonesimulator, arm64) cross file. Template: tools/ios/build.sh
# substitutes @IOS_SDK_PATH@, @IOS_DEPS_PREFIX@ and @IOS_MIN_VERSION@ into the
# build dir copy. See cross_pcport_ios.ini for the x86_64 host-machine note.
# ios-build hook.
[binaries]
c      = ['clang', '-target', 'arm64-apple-ios@IOS_MIN_VERSION@-simulator', '-isysroot', '@IOS_SDK_PATH@']
cpp    = ['clang++', '-target', 'arm64-apple-ios@IOS_MIN_VERSION@-simulator', '-isysroot', '@IOS_SDK_PATH@']
objc   = ['clang', '-target', 'arm64-apple-ios@IOS_MIN_VERSION@-simulator', '-isysroot', '@IOS_SDK_PATH@']
objcpp = ['clang++', '-target', 'arm64-apple-ios@IOS_MIN_VERSION@-simulator', '-isysroot', '@IOS_SDK_PATH@']
ar     = 'ar'
strip  = 'strip'

[built-in options]
c_args = ['-DSDK_BUILD_IOS', '-I@IOS_DEPS_PREFIX@/include']
cpp_args = ['-DSDK_BUILD_IOS', '-I@IOS_DEPS_PREFIX@/include']
objc_args = ['-DSDK_BUILD_IOS', '-I@IOS_DEPS_PREFIX@/include']
objcpp_args = ['-DSDK_BUILD_IOS', '-I@IOS_DEPS_PREFIX@/include']
c_link_args = ['-L@IOS_DEPS_PREFIX@/lib']
cpp_link_args = ['-L@IOS_DEPS_PREFIX@/lib']
objc_link_args = ['-L@IOS_DEPS_PREFIX@/lib']
objcpp_link_args = ['-L@IOS_DEPS_PREFIX@/lib']

[properties]
ios_deps_prefix = '@IOS_DEPS_PREFIX@'
needs_exe_wrapper = true

[host_machine]
system      = 'darwin'
cpu_family  = 'x86_64'
cpu         = 'x86_64'
endian      = 'little'
