# Build-machine (Mac host) file for the iOS cross build: the game data generators
# and other host tools build with this, the game itself with cross_pcport_ios*.ini.
# ios-build hook.
[binaries]
c   = 'clang'
cpp = 'clang++'
objc = 'clang'
objcpp = 'clang++'
ar  = 'ar'

[built-in options]
c_args = ['-I/opt/homebrew/include']
cpp_args = ['-I/opt/homebrew/include']
c_link_args = ['-L/opt/homebrew/lib']
cpp_link_args = ['-L/opt/homebrew/lib']
