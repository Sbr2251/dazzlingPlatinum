# macOS (Apple silicon) PC port: everything the port builds is a native target (as on Linux), so the build machine's compilers are the port's
[binaries]
c   = 'clang'
cpp = 'clang++'
objc = 'clang'
objcpp = 'clang++'
ar  = 'ar'

[built-in options]
c_args = ['-DSDK_BUILD_MACOS', '-I/opt/homebrew/include', '-I/Users/sreddy9/Documents/pokeplatinum-macos-deps/prefix/include']
cpp_args = ['-DSDK_BUILD_MACOS', '-I/opt/homebrew/include', '-I/Users/sreddy9/Documents/pokeplatinum-macos-deps/prefix/include']
c_link_args = ['-L/opt/homebrew/lib', '-L/Users/sreddy9/Documents/pokeplatinum-macos-deps/prefix/lib']
cpp_link_args = ['-L/opt/homebrew/lib', '-L/Users/sreddy9/Documents/pokeplatinum-macos-deps/prefix/lib']
