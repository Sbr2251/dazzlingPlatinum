# The port builds every target natively (the build machine's clang, meson/native_macos_port.ini); the host machine only has to satisfy the project's nasm language check,
# which meson refuses for aarch64 (the NX build has the same workaround), so it says x86_64 though everything is built for arm64
[binaries]
c   = 'clang'
cpp = 'clang++'
ar  = 'ar'

[host_machine]
system      = 'darwin'
cpu_family  = 'x86_64'
cpu         = 'x86_64'
endian      = 'little'
