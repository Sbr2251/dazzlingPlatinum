name: Build DazzlingPlatinum ROM

# Builds only when asked for: pushing to main no longer triggers a build
on:
  push:
    tags: [ "v*" ] # e.g. git tag v1.2 && git push origin v1.2
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Software
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends bison flex g++ gcc-arm-none-eabi git make ninja-build pkg-config python3 wget xz-utils libpng-dev

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Install Metroskrew
        run: sudo make skrew

      - name: Configure Repo
        run: make configure

      # `make check` compares against the vanilla SHA1 and always fails for this
      # hack; `make release` just builds the ROM (see CLAUDE.md).
      - name: Build ROM
        run: make -j$(nproc) release

      - name: Upload ROM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dazzlingPlatinum-rom
          path: out/dazzlingPlatinum.nds
